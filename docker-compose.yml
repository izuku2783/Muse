services:
  postgres:
    image: postgres:16
    container_name: muse-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: muse
      POSTGRES_USER: muse
      POSTGRES_PASSWORD: muse_password

    ports:
      - "5432:5432"

    volumes:
      - muse_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U muse -d muse"]
      interval: 5s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:v1.19.2
    container_name: muse-qdrant
    restart: unless-stopped

    ports:
      - "6333:6333"
      - "6334:6334"

    volumes:
      - muse_qdrant_data:/qdrant/storage


volumes:
  muse_postgres_data:
  muse_qdrant_data:
